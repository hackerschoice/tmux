# Enable below for Powerline-style separators for the status bar
# set -g @thc_sep_l "\uE0B0" ; set -g @thc_sep_r "\uE0B2"

if-shell 'test -e "$HOME/.cool"' { set -g @thc_sep_l "\uE0B0" ; set -g @thc_sep_r "\uE0B2" }
# To unload all variables (for testing):
# $ tmux show -g | awk '/^@thc_/ {print $1}' | xargs -n1 tmux set -gu
set -goq @thc_sep_l ""
set -goq @thc_sep_r ""
set -goq @thc_bg         "#0044AA"   # status bar
set -goq @thc_fg         black
set -goq @thc_sess_bg    colour17    # session name block
set -goq @thc_sess_fg    colour255
set -goq @thc_win_bg     colour25    # other windows
set -goq @thc_win_fg     colour255
set -goq @thc_cur_bg     colour75    # current window
set -goq @thc_cur_fg     black
set -goq @thc_mouse_bg   colour60    # "mouse on"
set -goq @thc_mouse_fg   colour189
set -goq @thc_off_bg     colour17    # "mouse off"
set -goq @thc_off_fg     colour103
set -goq @thc_border              "#5f87af"   # pane borders
set -goq @thc_border_active       "#5fafff"
set -goq @thc_border_mouse        "#af5f5f"   # pane borders while mouse is on
set -goq @thc_border_mouse_active "#ff5f5f"

set -g status-style "fg=#{@thc_fg},bg=#{@thc_bg}"
set -wg @hs_recording 0
set -g window-status-separator ''
set -g status-left-length 30
set -g status-left "#[fg=#{@thc_sess_fg},bg=#{@thc_sess_bg},bold] #S #[fg=#{@thc_sess_bg},bg=#{@thc_bg},nobold]#{@thc_sep_l} "
# @hs_recording (C-b R) turns the window's block red
set -g window-status-format         "#[fg=#{@thc_bg},bg=#{?@hs_recording,red,#{@thc_win_bg}}]#{@thc_sep_l}#[fg=#{@thc_win_fg}] #I:#W#{?window_flags,#{window_flags},} #[fg=#{?@hs_recording,red,#{@thc_win_bg}},bg=#{@thc_bg}]#{@thc_sep_l}"
set -g window-status-current-format "#[fg=#{@thc_bg},bg=#{?@hs_recording,red,#{@thc_cur_bg}}]#{@thc_sep_l}#[fg=#{@thc_cur_fg},bold] #I:#W#{?window_flags,#{window_flags},} #[fg=#{?@hs_recording,red,#{@thc_cur_bg}},bg=#{@thc_bg},nobold]#{@thc_sep_l}"
set -g status-right-length 120
set -g status-right "#{?mouse,#[fg=#{@thc_mouse_bg}]#{@thc_sep_r}#[fg=#{@thc_mouse_fg} bg=#{@thc_mouse_bg}] mouse on ,#[fg=#{@thc_off_bg}]#{@thc_sep_r}#[fg=#{@thc_off_fg} bg=#{@thc_off_bg}] mouse off }"

set -g display-time 10000
set -g history-limit 20000
setw -g monitor-activity on
set -g visual-activity on
set -wg pane-border-style 'fg=#{?mouse,#{@thc_border_mouse},#{@thc_border}}' ; set -wg pane-active-border-style 'fg=#{?mouse,#{@thc_border_mouse_active},#{@thc_border_active}}'

set -wg pane-border-lines double
set -g status-interval 1
set-option -g mode-style bg="\#75507B",fg="\#EEEEEE"
#bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe
# Stay in copy mode when scrolled up but exit copy mode when not scrolled.
bind-key -T copy-mode-vi MouseDragEnd1Pane if-shell -F -t = '#{scroll_position}' 'send-keys -X -t = copy-pipe' 'send-keys -X -t = copy-pipe-and-cancel'
# As small as the smallest participant:
set -g window-size smallest
set -g aggressive-resize off

# clear both screen and pane scrollback
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

bind B choose-buffer    # choose which buffer to paste from

# Testing:
# tmux source-file $(pwd)/tmux.conf

# tmux bug: when a line ends with ; then the last ; is not sent. Use "sed" to fix this:
# Prompt for a file and paste it to the remote.
bind-key P command-prompt -I "" -p "File to paste:" \
	'run-shell "f=\"%1\"; case \"\$f\" in \"~\"|\"~/\"*) f=\"\$HOME\${f#\\~}\";; esac; sed \"s/;\\$/;;/g\" \"\$f\" | while IFS= read -r x; do tmux send-keys -t \"#{pane_id}\" -l \"\$x\"; tmux send-keys -t \"#{pane_id}\" C-m; done"'

# eval hackshell on the remote
bind-key H run-shell -b '~/.config/tmux/tmux_hackshell-send.sh "#{pane_id}" || true'

# Upload a prompted local file to remote current directory using basename.
bind-key U command-prompt -I "" -p "Local file to upload:" \
	'run-shell -b "~/.config/tmux/tmux_upload.sh \"#{pane_id}\" \"%1\" || true"'

# Download a prompted remote file path to local CWD as basename(remote_path).
# Uses tmux pipe-pane capture (not history scraping) for robust transfers.
bind-key D command-prompt -I "" -p "Remote file to download:" \
	'run-shell -b "~/.config/tmux/tmux_download.sh \"#{pane_id}\" \"%1\" || true"'

# Cancel an in-flight U/D transfer on the current pane (sends C-c into the
# pane, same as pressing Ctrl-C yourself, plus a local flag the running
# transfer script checks). H/U/D above are backgrounded (-b) specifically so
# this binding can still be dispatched while one of them is in flight.
bind-key X run-shell -b '~/.config/tmux/tmux_cancel.sh "#{pane_id}"'

# Record current pane. Status is shown via the window name (not the global
# status line) since recording state is inherently per-pane/window - a
# session-wide status-right banner can't tell you WHICH window is actually
# being recorded, and looks the same whether the current window is recording
# or not, which caused starting a second recording (or stopping the wrong
# one) to go unnoticed. #{pane_pipe} is already checked per current-pane, so
# the toggle decision was always correct; only the display wasn't.
bind-key R \
	if -F '#{pane_pipe}' \
	'pipe-pane; set-window-option @hs_recording 0; rename-window "#{@hs_oldname}"; if -F "#{@hs_oldar}" "set-window-option automatic-rename on"; set-window-option -u window-status-style; set-option -wu @hs_oldname; set-option -wu @hs_oldar' \
	'if -F "#{==:#{@hs_oldname},}" "set-option -w -F @hs_oldname \"#{window_name}\""; if -F "#{==:#{@hs_oldar},}" "set-option -w -F @hs_oldar \"#{automatic-rename}\""; set-window-option @hs_recording 1; pipe-pane -o "exec cat >>\"\${HOME:?}\"/tmux-rec-#S:#I.#P-#W-\$(date +%s).txt"; rename-window "REC"; set-window-option window-status-style "fg=black,bg=red"'

# Screenshot the current pane
bind-key S \
	capture-pane -S -99999 \; \
	run-shell 'tmux save-buffer "${HOME}/tmux-save-#S:#I.#P-#W-$(date +%s).txt"' \; \
	delete-buffer \; \
	display-message 'Saved to ~/tmux-save-#S:#I.#P-#W.txt'

bind-key o display-popup -E -w 80% -h 80%

bind-key d detach-client -E 'printf "😘 \033[1;32mTIP: Press C-b h for help. More at \033[4m\033]8;;https://thc.org\007https://thc.org/tips\033]8;;\007\033[24m\033[0m\n"'

bind-key h display-popup -E -w 60 -h 22 -T "" \
	'printf "\033[?25l\033[1;36m"; \
	printf "%s\n" \
		"    ___________ ___ ___  _________" \
		"    \\__    ___//   |   \\ \\_   ___ \\" \
		"      |    | /    ~    \\/    \\  \\/" \
		"      |    | \\    Y    /\\     \\____" \
		"      |____|  \\___|_  /  \\______  /" \
		"                    \\/ est.1995 \\/"; \
	printf "\033[0m\n"; \
	printf "\033[36mC-b \033[1;36m%s\033[0;35m  %s\033[0m\n" \
		"H" "Load hackshell" \
		"U" "Upload a local file" \
		"D" "Download a remote file" \
		"X" "Cancel the upload or download" \
		"P" "Paste a local text file" \
		"R" "Start/stop recording" \
		"S" "Take a screenshot" \
		"o" "Open a popup shell (C-z on steroid)" \
		"m" "Toggle mouse support" \
		"B" "Choose a buffer" \
		"w" "Pick a window"; \
	printf "\n>>> \033[0;33mPress q or ESC to close.\033[0m"; \
	stty -echo -icanon min 1 time 0 || exit; \
	help_esc=$(printf "\033"); \
	while help_key=$(dd bs=1 count=1 2>/dev/null) && [ -n "$help_key" ]; do \
		case "$help_key" in q|"$help_esc") break ;; esac; \
	done'

set -g mouse on
setw -g mode-keys vi
bind-key m \
	if -F '#{mouse}' \
	'set mouse off' \
	'set mouse on'
